<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UrbanSound AI{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

        /* ---- NAVBAR ---- */
        nav {
            background: #1e293b;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.2rem;
            font-weight: 800;
            color: #6366f1;
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 0.3rem; }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links a:hover { background: #334155; color: #e2e8f0; }
        .nav-links a.active { background: #6366f1; color: white; }

        /* ---- FOOTER ---- */
        footer {
            margin-top: auto;
            background: #1e293b;
            border-top: 1px solid #334155;
            padding: 1.5rem 2rem;
            text-align: center;
            color: #475569;
            font-size: 0.85rem;
        }
        footer span { color: #6366f1; }

        /* ---- SHARED COMPONENTS ---- */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 2rem; }
        .page-header { text-align: center; padding: 3rem 2rem 2rem; }
        .page-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .page-header p { color: #94a3b8; font-size: 1rem; }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.5rem;
        }

        .badge {
            background: #312e81;
            color: #a5b4fc;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>

<nav>
    <a href="/" class="nav-brand">🔊 UrbanSound AI</a>
    <div class="nav-links">
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
        <a href="/classifier" {% if request.path == '/classifier' %}class="active"{% endif %}>Classifier</a>
        <a href="/dashboard" {% if request.path == '/dashboard' %}class="active"{% endif %}>Dashboard</a>
    </div>
</nav>

{% block content %}{% endblock %}

<footer>
    <p>Urban Sound Classification · Built with <span>Python, Flask, Librosa & Scikit-learn</span> · UrbanSound8K Dataset</p>
</footer>

{% block extra_scripts %}{% endblock %}
</body>
</html>
